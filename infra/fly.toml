# Replace `app` after running `flyctl launch` — Fly will assign a unique name.
app = "voice-agent-platform"
primary_region = "ord"

[build]
  dockerfile = "infra/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Demo defaults: machine sleeps when idle (free), cold-starts on first request (~5s).
  # For voice production, set min_machines_running = 1 and auto_stop_machines = false.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
