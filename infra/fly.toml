# fly.toml — filled in at deploy time
app = "voice-agent-platform"
primary_region = "ord"

[build]
  dockerfile = "infra/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
