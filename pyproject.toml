[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    # AI / LLM
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "langchain-core>=0.2.0",
    # DB
    "supabase>=2.5.0",
    "pgvector>=0.3.0",
    "asyncpg>=0.29.0",
    # Cache / state
    "upstash-redis>=1.1.0",
    # Calendar — Google service-account token minting (Cal.com uses httpx directly)
    "google-auth>=2.0.0",
    # Config / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    # Templating
    "jinja2>=3.1.4",
    # Observability
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["orchestrator*", "packs*", "simulator*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
